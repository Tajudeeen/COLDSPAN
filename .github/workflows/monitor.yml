name: Hosted API monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coldspan-monitor
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/check-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-readiness
          path: ops-output/readiness.json
          retention-days: 14
